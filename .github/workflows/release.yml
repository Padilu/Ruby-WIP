name: Release Ruby Assistant

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Delete Cargo.lock if exists
        run: |
          if (Test-Path "src-tauri/Cargo.lock") { Remove-Item "src-tauri/Cargo.lock" }
        shell: pwsh

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri NSIS Installer
        run: pnpm tauri build --bundles nsis --verbose

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'Ruby Assistant ${{ github.ref_name }}'
          fail_on_unmatched_files: false
          body: |
            ## Ruby AI Desktop Assistant ${{ github.ref_name }}
            Windows floating overlay AI assistant installer (NSIS).
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
