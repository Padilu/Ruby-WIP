name: Release Ruby Assistant

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles dmg,pkg'
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          work-dir: './src-tauri'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ruby Assistant ${{ github.ref_name }}'
          releaseBody: |
            ## Ruby AI Desktop Assistant ${{ github.ref_name }}
            
            Multi-platform floating overlay AI assistant for macOS Notch and Windows Taskbar.
            
            ### Included Installers:
            - **macOS**: `.dmg` (Drag-to-Applications) and `.pkg` (Installer package)
            - **Windows**: `.exe` (NSIS setup installer) and `.msi` (Windows Installer)
            
            ### Highlights:
            - Super fluid UI with Framer Motion spring physics
            - Native Notch and Taskbar System Tray overlay placement
            - Low-token quota testing and manual TTS audio replay
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
